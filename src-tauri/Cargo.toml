[package]
name = "tadidy"
version = "0.1.0"
description = "Clipboard history for the macOS menu bar"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "tadidy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
anyhow = "1.0.104"
getrandom = "0.4.3"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
uuid = { version = "1.29.0", features = ["v7"] }
window-vibrancy = "0.8.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
    "objc2-core-foundation",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSRunLoop",
    "NSString",
] }
tauri-nspanel = "2.1.1"
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
